[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pysubnettree-rs"
description = "Fast, memory-efficient longest-prefix-match lookups of IPv4/IPv6 subnets, written in Rust"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Georges Toth", email = "georges@trypill.org" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Programming Language :: Rust",
  "Topic :: Internet",
  "Topic :: System :: Networking",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
keywords = ["ip", "subnet", "cidr", "prefix", "longest-prefix-match", "trie", "routing"]
requires-python = ">= 3.11"
dependencies = []
dynamic = ["version"]

[dependency-groups]
dev = [
  "maturin>=1.9",
  "mypy",
  "ruff",
  "codespell",
  "prek>=0.3.2",
  { include-group = "test" },
]
test = [
  "pytest~=9.1",
  "pytest-cov>=7.1.0",
  "hypothesis>=6.100",
  "pydantic>=2.11",
]
bench = [
  "pysubnettree",
]
docs = [
  "zensical",
]

[tool.maturin]
python-source = "python"
module-name = "pysubnettree_rs._pysubnettree_rs"
features = ["python"]
include = [{ path = "LICENSE", format = "sdist" }]

[tool.uv]
# rebuild the extension when the Rust sources change
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "src/**/*.rs" }]

[tool.mypy]
strict = true
show_error_codes = true
show_error_context = true
show_column_numbers = true
warn_no_return = true
files = [
  "python/**/*.py",
  "python/**/*.pyi",
  "tests/**/*.py",
  "benchmarks/**/*.py",
]

[[tool.mypy.overrides]]
# tests are checked, but need no complete type annotations
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["SubnetTree"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--cov=pysubnettree_rs",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true

[tool.codespell]
skip = "*.lock,./target,./sample,./.venv,./site"
ignore-words-list = "asai"

[tool.ruff]
line-length = 160
indent-width = 4
target-version = "py311"
include = [
  "pyproject.toml",
  "python/**/*.py",
  "python/**/*.pyi",
  "tests/**/*.py",
  "benchmarks/**/*.py",
]

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "C", # flake8-comprehensions
  "B", # flake8-bugbear
  "D", # pydocstyle
  "N", # pep8-naming
  "UP", # pyupgrade
  "YTT", # flake8-2020
  "ANN", # flake8-annotations
  "S", # flake8-bandit
  "BLE", # flake8-blind-except
  "A", # flake8-builtins
  "COM", # flake8-commas
  "C4", # flake8-comprehensions
  "DTZ", # flake8-datetimez
  "EM103", # flake8-errmsg - dot-format-in-exception
  "EXE", # flake8-executable
  "ISC", # flake8-implicit-str-concat
  "ICN", # flake8-import-conventions
  "G", # flake8-logging-format
  "INP", # flake8-no-pep420
  "PIE", # flake8-pie
  "T20", # flake8-print
  "PYI", # flake8-pyi
  "RSE", # flake8-raise
  "RET", # flake8-return
  "SLF", # flake8-self
  "SLOT", # flake8-slots
  "TID", # flake8-tidy-imports
  "TC", # flake8-type-checking
  "PTH", # flake8-use-pathlib
  "TD", # flake8-todos
  "FIX", # flake8-fixme
  "ERA", # eradicate
  "PL", # Pylint
  "FLY", # flynt
  "PERF", # Perflint
  "RUF013", # implicit-optional
]
unfixable = [
  "ERA001",
  "T201", # `print` found
]
extend-select = ["Q", "RUF100", "C90"]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "single" }
ignore = [
  "C901", # too complex
  "E501", # line too long
  "ANN401", # any-type
  "PLR0913", # Too many arguments to function call
  "PLR0915", # Too many statements
  "PLR2004", # Magic value used in comparison
  "PLR0912", # Too many branches
  "COM812", # missing-trailing-comma
  "ISC001", # single-line-implicit-string-concatenation
  "Q001", # bad-quotes-multiline-string
  "RET504", # Unnecessary assignment before `return` statement
  "D401", # First line of docstring should be in imperative mood
  "D205", # 1 blank line required between summary line and description
]

[tool.ruff.lint.isort]
known-first-party = ["pysubnettree_rs"]

[tool.ruff.lint.flake8-type-checking]
# annotations of pydantic models and dataclasses are evaluated at runtime
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ANN", # Missing return type annotation
  "D", # Missing docstring
  "ERA001", # Found commented-out code
  "INP001", # tests are not a package
  "S101", # assert
  "S104", # "binding to all interfaces": 0.0.0.0 is test data here
  "PLC0415", # imports inside functions
]
"benchmarks/**" = [
  "INP001", # scripts, not a package
  "T201", # print
  "S311", # pseudo-random generators
  "PLC0415", # the implementations are imported lazily, each run uses only one
]
"*.pyi" = [
  "D", # documented in the Rust sources / docs
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.pydocstyle]
convention = "numpy"
