[package]
name = "pysubnettree-rs"
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
description = "Fast, memory-efficient longest-prefix-match lookups of IPv4/IPv6 subnets for Python"
license = "Apache-2.0"
readme = "README.md"
publish = false
# development only: research, benchmarks, docs, sample data and tooling are not packaged
exclude = [
  "/research",
  "/benchmarks",
  "/docs",
  "/sample",
  "/sample_configs",
  "/scripts",
  "/site",
  "/.github",
  "/zensical.toml",
  "/TODO.md",
  "/AGENTS.md",
  "/t.py",
  "/tt.py",
]

[lib]
name = "pysubnettree_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
# The Python bindings. Disable (`--no-default-features`) to test the pure Rust core without libpython.
python = ["dep:pyo3"]

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# HashTable: indexes of ids hashed by content (strings, values), 5 bytes per entry
hashbrown = { version = "0.17", default-features = false }
pyo3 = { version = "0.30", optional = true }

[lints.rust]
unsafe_code = "forbid"

# pedantic and nursery on top of the defaults (prek / CI run clippy with -D warnings); the few
# lints below are allowed on purpose
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# `expect` is only used for invariants (ids fit u32, slices have the checked length): a panics
# section on every such function would document impossible cases
missing_panics_doc = "allow"
# `map_or_else(|| .., |x| ..)` chains read worse than `if let` / `match` for two-way results
option_if_let_else = "allow"
# pyo3 methods take owned arguments (`PathBuf`, `Option<Bound<..>>`) as extracted
needless_pass_by_value = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
