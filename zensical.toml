[project]
site_name = "pysubnettree-rs"
site_description = "Fast, memory-efficient longest-prefix-match lookups of IPv4/IPv6 subnets"
repo_name = "pysubnettree-rs"
copyright = "Apache License 2.0"
nav = [
  { "Home" = "index.md" },
  { "Usage" = "usage.md" },
  { "Design" = "design.md" },
  { "File format" = "format.md" },
  { "Lookup algorithms" = "algorithms.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
